services:
  # ── Backend ─────────────────────────────────────────────────────────────────
  # FastAPI + uvicorn served by Docker.
  # Root Dockerfile (./Dockerfile) is used because Render sets dockerfilePath
  # to ./Dockerfile by default and the PATCH API does not override it.
  - type: web
    name: codeguardian-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://codeguardian-frontend.onrender.com
      - key: CODEGUARDIAN_DB_PATH
        value: /tmp/.codeguardian/analyses.sqlite3
      - key: LLM_PROVIDER
        value: ollama

  # ── Frontend ─────────────────────────────────────────────────────────────────
  # React + Vite SPA built in Docker, served by nginx.
  # VITE_API_URL is a Docker ARG baked into the JS bundle at build time.
  - type: web
    name: codeguardian-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: frontend
    plan: free
    dockerBuildArgs:
      - key: VITE_API_URL
        value: https://codeguardian-backend-kk78.onrender.com
    envVars:
      - key: VITE_API_URL
        value: https://codeguardian-backend-kk78.onrender.com
